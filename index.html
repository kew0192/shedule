<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit it - Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .background_auth {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f0;
            font-family: Arial, sans-serif;
        }

        .box-auth {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 100, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .text--one {
            font-size: 28px;
            font-weight: bold;
            color: #2d5a2d;
            margin-bottom: 8px;
        }

        .text--two {
            font-size: 14px;
            color: #5a7a5a;
            margin-bottom: 25px;
            display: block;
        }

        .input--one {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d4e8d4;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .input--one:focus {
            border-color: #2d7a2d;
        }

        .button {
            width: 100%;
            padding: 12px;
            background: #2d7a2d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .button:hover {
            background: #1f5a1f;
        }

        .button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="background_auth">
    <div class="box-auth">
        <h1 class="text text--one">Авторизация</h1>
        <span class="text text--two">Добро пожаловать, введите пропускной код</span>
        <input type="text" class="input input--one" id="login" placeholder="Введите код">
        <button class="button" id="go_to_main">Войти</button>
    </div>
    <script src="js_scripts/authlog.js"></script>
</body>
</html>
